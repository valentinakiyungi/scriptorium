<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Scriptorium</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper: #f5efe3; --panel: #fbf8f1; --ink: #1f1b16; --muted: #6f665a; --rule: #ddd3c1;
    --rubric: #a33a26; --rubric-soft: #f3dfd6; --gold: #b0852b; --ok: #3f7a4f;
    --a-supervisor: #7b3f8c; --a-planner: #1f6f78; --a-researcher: #2d5aa0; --a-collator: #6f665a;
    --a-writer: #3f7a4f; --a-assembler: #6f665a; --a-reviewer: #b0852b;
    --serif: "Newsreader", Georgia, serif; --display: "Fraunces", Georgia, serif;
    --sans: "Inter", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #15120e; --panel: #1d1914; --ink: #ece4d4; --muted: #a39886; --rule: #352e25;
      --rubric: #e2795f; --rubric-soft: #3a221b; --gold: #d8ad55; --ok: #7cba8a;
      --a-supervisor: #c58fd6; --a-planner: #6cc3cc; --a-researcher: #86aef0; --a-collator: #a39886;
      --a-writer: #7cba8a; --a-assembler: #a39886; --a-reviewer: #d8ad55;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 14px; }
  header { display: flex; align-items: baseline; gap: 14px; padding: 18px 28px; border-bottom: 1px solid var(--rule); }
  .mark { font-family: var(--display); font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
  .mark b { color: var(--rubric); }
  .tagline { color: var(--muted); font-size: 13px; }
  .status { margin-left: auto; font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); margin-right: 6px; }
  .status.bad .dot { background: var(--rubric); }
  main { display: grid; grid-template-columns: 380px minmax(0, 1fr); min-height: calc(100vh - 66px); }
  aside { border-right: 1px solid var(--rule); padding: 22px 24px; display: flex; flex-direction: column; gap: 22px; }
  aside h2 { font-family: var(--display); font-weight: 500; font-size: 15px; letter-spacing: 0.04em; text-transform: uppercase; margin: 0 0 12px; color: var(--muted); }
  label { display: block; font-size: 12px; font-weight: 500; color: var(--muted); margin: 12px 0 5px; }
  input[type=text], textarea, select { width: 100%; font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 9px 11px; }
  textarea { resize: vertical; min-height: 64px; }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--rubric); outline-offset: -1px; border-color: transparent; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; line-height: 1.45; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .check { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 13px; color: var(--ink); }
  button.primary { margin-top: 16px; width: 100%; padding: 11px; font: 600 14px var(--sans); color: #fff; background: var(--rubric); border: 0; border-radius: 6px; cursor: pointer; }
  button.primary:disabled { opacity: .55; cursor: progress; }
  .pipeline { display: flex; flex-wrap: wrap; gap: 6px; }
  .agent { font-family: var(--mono); font-size: 11.5px; padding: 5px 8px; border: 1px solid var(--rule); border-radius: 999px; color: var(--muted); display: flex; gap: 6px; align-items: center; transition: all .2s; }
  .agent i { font-style: normal; width: 7px; height: 7px; border-radius: 50%; background: var(--rule); }
  .agent.seen { color: var(--ink); }
  .agent.seen i { background: var(--c); }
  .agent.active { border-color: var(--c); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 18%, transparent); color: var(--ink); }
  .agent.active i { animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  .agent small { color: var(--muted); }
  .log { font-family: var(--mono); font-size: 11.5px; line-height: 1.55; max-height: 340px; overflow: auto; border-top: 1px solid var(--rule); padding-top: 8px; }
  .log div { padding: 3px 0; border-bottom: 1px dashed var(--rule); }
  .log b { font-weight: 500; color: var(--c); }
  .log .t { color: var(--muted); }
  section.doc { padding: 22px clamp(16px, 4vw, 56px) 60px; min-width: 0; }
  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--rule); margin-bottom: 26px; flex-wrap: wrap; }
  .tabs button { font: 500 13px var(--sans); background: none; border: 0; padding: 9px 14px; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tabs button.on { color: var(--ink); border-color: var(--rubric); }
  .tabs .spacer { flex: 1; }
  .tabs a.dl { font: 500 13px var(--sans); color: var(--rubric); text-decoration: none; padding: 9px 4px; }
  .metrics { display: flex; flex-wrap: wrap; gap: 8px 22px; margin: -8px 0 22px; font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .metrics b { color: var(--ink); font-weight: 500; }
  .manuscript { max-width: 760px; font-family: var(--serif); font-size: 18px; line-height: 1.65; }
  .manuscript h1 { font-family: var(--display); font-size: clamp(28px, 4vw, 40px); line-height: 1.15; letter-spacing: -0.015em; margin: 0 0 8px; }
  .manuscript h1 + p em { font-family: var(--sans); font-style: normal; font-size: 13px; color: var(--muted); }
  .manuscript h2 { font-family: var(--display); font-size: 23px; font-weight: 500; margin: 38px 0 10px; color: var(--ink); }
  .manuscript h2::before { content: "§ "; color: var(--rubric); }
  .manuscript h3 { font-size: 19px; margin: 24px 0 6px; }
  .manuscript a { color: var(--rubric); }
  .manuscript table { border-collapse: collapse; font-size: 15px; display: block; overflow-x: auto; }
  .manuscript td, .manuscript th { border: 1px solid var(--rule); padding: 6px 10px; }
  .manuscript sup.c { font-family: var(--sans); font-size: 11px; color: var(--rubric); }
  .manuscript blockquote { border-left: 3px solid var(--rubric); margin: 16px 0; padding: 2px 16px; color: var(--muted); }
  .manuscript code { font-family: var(--mono); font-size: .85em; background: var(--panel); padding: 1px 4px; border-radius: 3px; }
  .manuscript pre { background: var(--panel); padding: 12px; overflow-x: auto; border-radius: 6px; }
  .empty { max-width: 560px; color: var(--muted); font-family: var(--serif); font-size: 19px; line-height: 1.6; padding-top: 40px; }
  .empty .big { font-family: var(--display); font-size: 34px; color: var(--ink); line-height: 1.15; margin-bottom: 14px; }
  .empty .flow { font-family: var(--mono); font-size: 12.5px; margin-top: 22px; color: var(--muted); }
  .card { background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 14px 16px; margin-bottom: 12px; max-width: 820px; }
  .card h4 { margin: 0 0 6px; font-size: 14px; }
  .card p, .card li { color: var(--muted); line-height: 1.5; margin: 4px 0; }
  .score { font-family: var(--display); font-size: 40px; color: var(--rubric); }
  .src { display: grid; grid-template-columns: 36px 1fr; gap: 4px 10px; padding: 8px 0; border-bottom: 1px dashed var(--rule); max-width: 820px; }
  .src span { font-family: var(--mono); color: var(--rubric); }
  .src a { color: var(--ink); word-break: break-all; }
  .src small { grid-column: 2; color: var(--muted); word-break: break-all; }
  .err { color: var(--rubric); background: var(--rubric-soft); padding: 10px 12px; border-radius: 6px; }
  .hist { cursor: pointer; }
  .hist:hover { border-color: var(--rubric); }
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; }
    aside { border-right: 0; border-bottom: 1px solid var(--rule); padding: 18px 16px; }
    header { padding: 14px 16px; flex-wrap: wrap; }
    .status { margin-left: 0; width: 100%; }
    section.doc { padding: 18px 16px 48px; }
  }
</style>
</head>
<body>
<header>
  <div class="mark">Scripto<b>r</b>ium</div>
  <div class="tagline">Autonomous research &amp; drafting</div>
  <div class="status" id="status"><span class="dot"></span>connecting…</div>
</header>
<main>
  <aside>
    <form id="form">
      <h2>Commission a document</h2>
      <label for="topic">Topic</label>
      <textarea id="topic" required placeholder="e.g. The economics of offshore wind in Northern Europe"></textarea>
      <label for="docType">Document type</label>
      <select id="docType"></select>
      <div class="hint" id="typeHint"></div>
      <label for="audience">Audience</label>
      <input type="text" id="audience" placeholder="Uses the document type's default" />
      <label for="instructions">Instructions <span style="font-weight:400">(optional)</span></label>
      <textarea id="instructions" placeholder="Focus, tone, things to include or avoid"></textarea>
      <div class="row">
        <div><label for="maxQuestions">Research questions</label><input type="text" id="maxQuestions" value="8" inputmode="numeric" /></div>
        <div><label for="maxRevisions">Revision rounds</label><input type="text" id="maxRevisions" value="1" inputmode="numeric" /></div>
      </div>
      <label class="check"><input type="checkbox" id="web" checked /> Live web research (Google Search grounding)</label>
      <button class="primary" id="go" type="submit">Draft document</button>
    </form>
    <div>
      <h2>Agents</h2>
      <div class="pipeline" id="pipeline"></div>
      <div class="log" id="log"></div>
    </div>
  </aside>
  <section class="doc">
    <div class="tabs" id="tabs">
      <button data-tab="document" class="on">Document</button>
      <button data-tab="sources">Sources</button>
      <button data-tab="review">Review</button>
      <button data-tab="plan">Plan</button>
      <button data-tab="history">History</button>
      <span class="spacer"></span>
      <a class="dl" id="download" hidden>Download .md</a>
    </div>
    <div class="metrics" id="metrics" hidden></div>
    <div id="view"></div>
  </section>
</main>
<script>
const AGENTS = ["supervisor", "planner", "researcher", "collator", "writer", "assembler", "reviewer"];
const $ = (id) => document.getElementById(id);
const state = { tab: "document", markdown: "", plan: null, reviews: [], sources: [], findings: [], runId: null, counts: {}, done: null };

// Minimal, escape-first Markdown renderer (no CDN, safe by construction: all text is escaped
// before any markup is added, and only http(s) links are allowed).
function inline(t) {
  return esc(t)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\[(\d+)\](?!\()/g, '<sup class="c">[$1]</sup>');
}
function md(src) {
  const lines = String(src).replace(/\r/g, "").split("\n");
  const out = []; let i = 0;
  while (i < lines.length) {
    const l = lines[i];
    if (!l.trim()) { i++; continue; }
    const h = l.match(/^(#{1,4})\s+(.*)$/);
    if (h) { const n = h[1].length; out.push(`<h${n}>${inline(h[2])}</h${n}>`); i++; continue; }
    if (/^```/.test(l)) { const buf = []; i++; while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]); i++; out.push(`<pre><code>${esc(buf.join("\n"))}</code></pre>`); continue; }
    if (/^\|.*\|\s*$/.test(l) && /^\|?\s*:?-{2,}/.test(lines[i + 1] || "")) {
      const row = (r) => r.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim());
      const head = row(l); i += 2; const body = [];
      while (i < lines.length && /^\|.*\|\s*$/.test(lines[i])) body.push(row(lines[i++]));
      out.push(`<table><thead><tr>${head.map((c) => `<th>${inline(c)}</th>`).join("")}</tr></thead><tbody>${body.map((r) => `<tr>${r.map((c) => `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table>`);
      continue;
    }
    const list = l.match(/^\s*([-*+]|\d+\.)\s+/);
    if (list) {
      const ordered = /\d/.test(list[1]); const items = [];
      while (i < lines.length && /^\s*([-*+]|\d+\.)\s+/.test(lines[i])) {
        let item = lines[i++].replace(/^\s*([-*+]|\d+\.)\s+/, "");
        while (i < lines.length && /^\s{2,}\S/.test(lines[i]) && !/^\s*([-*+]|\d+\.)\s+/.test(lines[i])) item += " " + lines[i++].trim();
        items.push(`<li>${inline(item)}</li>`);
      }
      out.push(ordered ? `<ol>${items.join("")}</ol>` : `<ul>${items.join("")}</ul>`); continue;
    }
    if (/^>\s?/.test(l)) { const buf = []; while (i < lines.length && /^>\s?/.test(lines[i])) buf.push(lines[i++].replace(/^>\s?/, "")); out.push(`<blockquote>${inline(buf.join(" "))}</blockquote>`); continue; }
    const buf = [];
    while (i < lines.length && lines[i].trim() && !/^(#{1,4}\s|```|\s*([-*+]|\d+\.)\s+|>|\|)/.test(lines[i])) buf.push(lines[i++]);
    if (!buf.length) buf.push(lines[i++]);
    out.push(`<p>${inline(buf.join(" "))}</p>`);
  }
  return out.join("\n");
}
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

function renderPipeline(active) {
  $("pipeline").innerHTML = AGENTS.map((a) => {
    const n = state.counts[a] || 0;
    return `<span class="agent ${n ? "seen" : ""} ${a === active ? "active" : ""}" style="--c:var(--a-${a})"><i></i>${a}${n > 1 ? ` <small>×${n}</small>` : ""}</span>`;
  }).join("");
}

function log(ev) {
  const d = document.createElement("div");
  d.style.setProperty("--c", `var(--a-${ev.agent})`);
  d.innerHTML = `<b>${ev.agent}</b> ${esc(ev.message)} ${ev.ms > 50 ? `<span class="t">${(ev.ms / 1000).toFixed(1)}s</span>` : ""}`;
  $("log").appendChild(d);
  $("log").scrollTop = $("log").scrollHeight;
}

function render() {
  document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("on", b.dataset.tab === state.tab));
  const v = $("view");
  if (state.tab === "document") {
    v.innerHTML = state.markdown
      ? `<article class="manuscript">${md(state.markdown)}</article>`
      : `<div class="empty"><div class="big">A research team, on commission.</div>
         Give Scriptorium a topic and a document type. A supervisor agent plans the work, dispatches researchers in parallel to gather cited evidence, has writers draft every section at once, and sends the result to a reviewer — revising until it meets the bar.
         <div class="flow">supervisor → planner → researchers ∥ → collator → writers ∥ → assembler → reviewer ↺</div></div>`;
  } else if (state.tab === "sources") {
    const refs = state.done?.references || [];
    v.innerHTML = refs.length
      ? `<p class="hint" style="margin:0 0 12px">${refs.length} sources cited in the document${state.sources.length > refs.length ? ` · ${state.sources.length} consulted` : ""}.</p>` +
        refs.map((r) => `<div class="src"><span>[${r.id}]</span><a href="${r.kind === "web" ? esc(r.url) : "#"}" target="_blank" rel="noopener">${esc(r.title)}</a><small>${esc(r.url)}</small></div>`).join("")
      : `<p class="hint">Sources appear here once the document is assembled.</p>`;
  } else if (state.tab === "review") {
    v.innerHTML = state.reviews.length
      ? state.reviews.map((r) => `<div class="card"><div style="display:flex;gap:16px;align-items:center"><span class="score">${r.score}<small style="font-size:16px">/10</small></span>
          <div><h4>Round ${r.iteration} · ${r.passes ? "passed" : "revision requested"}</h4><p>${esc(r.summary)}</p></div></div>
          ${r.sectionFeedback.length ? `<ul>${r.sectionFeedback.map((f) => `<li><b>${esc(f.sectionId)}</b>: ${esc(f.feedback)}</li>`).join("")}</ul>` : ""}
          ${r.gapQuestions.length ? `<p><b>Gap research:</b> ${r.gapQuestions.map((g) => esc(g.question)).join(" · ")}</p>` : ""}</div>`).join("")
      : `<p class="hint">The reviewer's scorecard appears after the first draft.</p>`;
  } else if (state.tab === "plan") {
    v.innerHTML = state.plan
      ? `<div class="card"><h4>${esc(state.plan.title)}</h4><p>${esc(state.plan.summary)}</p></div>` +
        state.plan.sections.map((s) => `<div class="card"><h4>${esc(s.heading)}</h4><p>${esc(s.goal)}</p>${s.questions.length ? `<ul>${s.questions.map((q) => {
          const f = state.findings.find((x) => x.question === q);
          return `<li>${esc(q)}${f ? ` <span class="hint">· ${f.sources} sources, ${(f.ms / 1000).toFixed(1)}s</span>` : ""}</li>`;
        }).join("")}</ul>` : ""}</div>`).join("")
      : `<p class="hint">The planner's outline and research questions appear here.</p>`;
  } else if (state.tab === "history") {
    v.innerHTML = `<p class="hint">Loading…</p>`;
    fetch("/api/history").then((r) => r.json()).then((items) => {
      v.innerHTML = items.length
        ? items.map((i) => `<div class="card hist" data-id="${esc(i.id)}"><h4>${esc(i.title)}</h4><p>${esc(i.docType)} · ${i.words ?? "?"} words · score ${i.score ?? "–"}/10 · ${esc(i.id.slice(0, 10))}</p></div>`).join("")
        : `<p class="hint">No saved documents yet.</p>`;
      v.querySelectorAll(".hist").forEach((el) => el.onclick = async () => {
        state.markdown = await (await fetch(`/api/history/${el.dataset.id}`)).text();
        state.tab = "document"; render();
      });
    });
  }
}

$("tabs").addEventListener("click", (e) => { const t = e.target.dataset?.tab; if (t) { state.tab = t; render(); } });

let config;
fetch("/api/config").then((r) => r.json()).then((c) => {
  config = c;
  $("docType").innerHTML = c.docTypes.map((d) => `<option value="${d.id}">${esc(d.label)}</option>`).join("");
  const hint = () => { const d = c.docTypes.find((x) => x.id === $("docType").value); $("typeHint").textContent = `${d.description} Sections: ${d.sections.join(" · ")}.`; $("audience").placeholder = d.defaultAudience; };
  $("docType").onchange = hint; hint();
  $("status").className = "status" + (c.ready ? "" : " bad");
  $("status").innerHTML = `<span class="dot"></span>${c.ready ? esc(c.model) : "GEMINI_API_KEY missing — add it to .env"}`;
}).catch(() => { $("status").className = "status bad"; $("status").innerHTML = '<span class="dot"></span>server unreachable'; });
renderPipeline(); render();

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  Object.assign(state, { markdown: "", plan: null, reviews: [], sources: [], findings: [], counts: {}, done: null, tab: "document" });
  $("log").innerHTML = ""; $("metrics").hidden = true; $("download").hidden = true;
  $("go").disabled = true; $("go").textContent = "Working…";
  renderPipeline(); render();
  const body = {
    topic: $("topic").value.trim(), docType: $("docType").value, audience: $("audience").value.trim(),
    instructions: $("instructions").value.trim(), maxQuestions: +$("maxQuestions").value || 8,
    maxRevisions: +$("maxRevisions").value, web: $("web").checked,
  };
  const r = await fetch("/api/runs", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
  const j = await r.json();
  if (!r.ok) { $("view").innerHTML = `<div class="err">${esc(j.error)}</div>`; return reset(); }
  state.runId = j.id;
  const es = new EventSource(`/api/runs/${j.id}/events`);
  es.onmessage = (m) => {
    const ev = JSON.parse(m.data);
    if (ev.type === "trace") { state.counts[ev.event.agent] = (state.counts[ev.event.agent] || 0) + 1; log(ev.event); renderPipeline(nextAgent(ev.event)); }
    if (ev.type === "plan") { state.plan = ev.plan; if (state.tab === "plan") render(); }
    if (ev.type === "finding") state.findings.push(ev.finding);
    if (ev.type === "draft") { state.markdown = ev.markdown; if (state.tab === "document") render(); }
    if (ev.type === "review") { state.reviews.push(ev.review); if (state.tab === "review") render(); }
    if (ev.type === "error") { $("view").innerHTML = `<div class="err">${esc(ev.message)}</div>`; es.close(); reset(); }
    if (ev.type === "done") {
      es.close();
      fetch(`/api/runs/${j.id}/run.json`).then((x) => x.json()).then((full) => {
        state.done = full; state.sources = full.sources; state.markdown = full.markdown;
        const m = full.metrics;
        $("metrics").innerHTML = [["words", m.words], ["references", m.citedReferences], ["citations", m.citations], ["score", `${m.finalScore ?? "–"}/10`], ["revisions", m.revisions], ["LLM calls", m.llmCalls], ["time", `${(m.totalMs / 1000).toFixed(1)}s`]]
          .map(([k, v]) => `<span>${k} <b>${v}</b></span>`).join("");
        $("metrics").hidden = false;
        $("download").href = `/api/runs/${j.id}/document.md`; $("download").hidden = false;
        renderPipeline(); render(); reset();
      });
    }
  };
  es.onerror = () => { es.close(); if (!state.done) reset(); };
});

function nextAgent(ev) {
  if (ev.agent !== "supervisor") return ev.agent;
  const m = ev.message;
  if (/Planner/.test(m)) return "planner";
  if (/Researcher|researching/i.test(m)) return "researcher";
  if (/Writer|revision round/i.test(m)) return "writer";
  if (/Reviewer/.test(m)) return "reviewer";
  return null;
}
